<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Studio</title></head><body>
<header><span>MY STUDIO</span></header>
<main id="viewport" aria-label="Interactive personal studio"><div id="frame"><svg id="hit-regions" aria-hidden="true"></svg><div id="targets"></div></div></main>
<section id="music-card" class="glass-card" aria-label="Music player" hidden>
<button class="dismiss" data-close="music" aria-label="Close music player">×</button>
<div class="track"><div id="cover-placeholder" class="cover" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2"/><ellipse cx="17" cy="15" rx="3" ry="2"/></svg></div><img id="cover" class="cover" alt="Album artwork" hidden><div class="track-copy"><strong id="track-title">Studio soundtrack</strong><span id="track-artist">Choose your music</span></div></div>
<div class="transport"><button id="previous" aria-label="Previous track" disabled><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5L8 12l11 7z"/></svg></button><button id="play" aria-label="Play" disabled><svg viewBox="0 0 24 24"><path d="m8 4 12 8-12 8z"/></svg></button><button id="next" aria-label="Next track" disabled><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l11 7-11 7z"/></svg></button></div>
<input id="seek" type="range" min="0" max="1000" value="0" aria-label="Playback progress" disabled><div class="track-meta"><span id="elapsed">0:00</span><button id="choose-tracks">Add music</button><span id="duration">0:00</span></div><div class="music-options"><button id="choose-cover" hidden>Change artwork</button><label>Volume<input id="volume" type="range" min="0" max="1" step=".01" value=".35" aria-label="Volume"></label></div><p id="music-message" aria-live="polite"></p>
</section>
<section id="contact-card" class="glass-card info-card" aria-label="Contact details" hidden><button class="dismiss" data-close="contact" aria-label="Close contact details">×</button><h2>Let’s connect.</h2><div id="contact-content"></div><button id="sleep-phone" class="text-button">Turn off phone screen</button></section>
<section id="education-card" class="glass-card info-card" aria-label="Education details" hidden><button class="dismiss" data-close="education" aria-label="Close education details">×</button><h2>Stony Brook<br>University</h2><div id="education-content"></div></section>
<p id="hint">Move to explore · Click objects on the desk</p><p id="status" class="sr-only" aria-live="polite"></p><div id="loading" role="status">Opening Studio…</div>
<input id="audio-file" type="file" accept="audio/*" multiple hidden><input id="cover-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><audio id="audio" preload="metadata"></audio><script type="module" src="/src/main.js"></script></body></html>
